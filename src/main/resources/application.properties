# Puerto en el que escucha la API
server.port=8080

# Conexión a MariaDB (base de datos "cc"). Usuario y contraseña se leen de
# variables de entorno para no subir credenciales a GitHub.
spring.datasource.url=jdbc:mariadb://localhost:3307/cc
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate NO crea, modifica ni valida tablas: la base de datos no se toca
spring.jpa.hibernate.ddl-auto=none

# Respeta los nombres de columnas tal como se escriben (idShoppingCart, codUsuario...)
# Sin esto, Hibernate los convertiría a snake_case y fallaría
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Evita mantener la conexión abierta durante toda la petición web
spring.jpa.open-in-view=false